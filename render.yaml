services:
  - type: web
    name: purvadrishti-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_ENABLED
        value: "false"
      - key: ALERT_CHANNELS
        value: dashboard,webhook
